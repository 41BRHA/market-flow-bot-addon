name: Smart Money Tracker
version: "0.7.0"
slug: smart_money_tracker
description: Politician disclosures, stock exposure and political-flow mapping with Market Flow integration.
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_title: Politician Trades
panel_icon: mdi:account-tie
options:
  house_enabled: true
  executive_enabled: true
  lookback_days: 365
  refresh_hours: 6
  reports_per_cycle: 30
  fmp_api_key: ""
  senate_pages: 5
  market_flow_url: "http://local-market-flow-bot:8099"
  notify_service: "notify.adam_mobile"
  sec_user_agent: ""
  display_timezone: "Europe/London"
schema:
  house_enabled: bool
  executive_enabled: bool
  lookback_days: int(7,1825)
  refresh_hours: int(1,48)
  reports_per_cycle: int(1,100)
  fmp_api_key: password?
  senate_pages: int(1,20)
  market_flow_url: str?
  notify_service: str
  sec_user_agent: str?
  display_timezone: "list(Europe/London|UTC|Europe/Dublin|Europe/Paris|Europe/Warsaw|America/New_York|America/Chicago|America/Denver|America/Los_Angeles|Asia/Dubai|Asia/Kolkata|Asia/Hong_Kong|Asia/Singapore|Asia/Tokyo|Australia/Sydney)"
